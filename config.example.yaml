# Copy to config.yaml and edit. config.yaml is gitignored.
# Secrets are NOT stored here — only the names of the env vars that hold them.

github:
  gh_path: /opt/homebrew/bin/gh      # ABSOLUTE path — bypasses shell shims/aliases
  git_path: git                       # git binary for local-clone symbol resolution (restart-only)
  token_env: GH_TOKEN                 # daemon reads the bot PAT from this env var
  bot_login: edmundhee-reviewbot      # the bot's REAL username (no [bot] suffix)
  request_timeout_seconds: 60

deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  thinking: enabled                   # enabled | disabled
  reasoning_effort: high              # high | max  (only used when thinking=enabled)
  request_timeout_seconds: 600
  prices:                             # USD per 1M tokens — for cost logging only
    input_per_1m: 0.28
    output_per_1m: 3.48               # post-promo rate (promo ended 2026-05-31)

repos:
   - owner/repo-two

poll:
  interval_seconds: 180

review_policy:
  skip_drafts: true
  review_backlog_on_start: false      # false = baseline existing open PRs as seen on first run
  ignore_authors:
    - dependabot[bot]
    - renovate[bot]
    - github-actions[bot]
  # bot_login is always added to this set automatically.

diff:
  max_diff_bytes: 400000              # POST-FILTER size cap: target review-chunk size (multi) / skip threshold (single)
  per_run_input_token_cap: 250000     # context-size gate (chars/4); in multi it caps the SUM over lenses
  oversized_behavior: notice          # notice | skip
  chunk_reviews: true                 # multi: split an over-cap filtered diff into whole-file chunks and review ALL of it
  hard_max_diff_bytes: 5000000        # raw pre-filter sanity ceiling (OOM guard); beyond this the PR is still skipped
  max_review_chunks: 10               # cost guard: chunks past this are not reviewed, listed in the comment instead
  # test_globs: paths the test_coverage lens treats as tests (omit to use built-in defaults)
  skip_globs:
    - "**/*.lock"
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/dist/**"
    - "**/build/**"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/__generated__/**"
    - "**/*.pb.go"
    - "**/*.snap"
    - "**/*.svg"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.pdf"

budgets:
  daily_usd_budget: 5.00              # rolling 24h ceiling across all reviews
  budget_exceeded_behavior: notice    # notice | skip

review:
  mode: multi                         # multi (default, accurate) | single (one call)
  # multi runs each lens as its own model call, then scores EVERY finding — so it
  # costs roughly (lenses + findings*scoring_votes)x a single review. That is the
  # intended trade: accuracy over cost.
  confidence_threshold: 80            # keep only findings scored >= this (0-100)
  scoring_votes: 1                    # score each finding N times; median is kept (odd N)
  lenses:                             # omit to use all; test_coverage drives the verdict
    - correctness
    - security
    - maintainability
    - test_coverage
    - consistency                     # convention/consistency findings the bug lenses drop
                                      # (divergent siblings, half-applied fixes, violations of
                                      # the repo's own CLAUDE.md); scored by a dedicated pass
                                      # that does NOT cap style at 25. Fed the repo's own docs
                                      # (see fetch_conventions). Drop it to skip this class.
  fetch_conventions: true             # read the target repo's own CLAUDE.md/CONTRIBUTING.md/
                                      # AGENTS.md at the PR head and feed them to the consistency
                                      # lens as authoritative convention rules (local-clone-first,
                                      # gh fallback, best-effort). Only fires when the consistency
                                      # lens is enabled. false to skip the fetch.
  conventions_max_chars: 6000         # budget for the rendered ## CONVENTIONS block
  max_parallel: 0                     # cap concurrent model calls; 0 = unbounded
  read_prior_comments: true           # feed the PR's existing comments (bot + human,
                                      # timeline + inline) back as context, and let the
                                      # scorer suppress issues already raised. false to disable.
  prior_comment_max_chars: 6000       # budget for the rendered prior-discussion block
  rereview_on_mention: true           # a new comment that @mentions the bot triggers a fresh
                                      # full review (no new commit needed). false to disable.
  local_checkout: true                # resolve referenced symbols from a local shallow clone of the
                                      # PR head (one `git fetch pull/N/head` per review, then all
                                      # reads/greps are local — network-resilient AND indexes the PR
                                      # head, unlike `gh search code`). Falls back to gh per-symbol on
                                      # any miss/failure. false = gh-only (the old behavior).
  advisor_provider: deepseek          # who runs the planner + scoring passes. Lenses always
                                      # stay on DeepSeek; only these two passes move. Restart to apply.
                                      #   deepseek — default; DeepSeek does everything (no extra block).
                                      #   claude   — Claude Opus via the `claude -p` CLI (your Claude
                                      #              subscription, no API key). Needs the `claude:` block
                                      #              below + a logged-in `claude` CLI.
                                      #   openai   — any OpenAI-compatible endpoint (e.g. GLM-5.2 via a
                                      #              Z.ai Coding Plan). Needs the `advisor:` block below +
                                      #              its api_key_env exported.
                                      # claude/openai both give cross-model verification (a different
                                      # model refutes the finding than raised it) + lower DeepSeek spend.
  agentic_scoring: false              # multi: run the scoring pass as `claude -p` WITH Read/Grep/Glob
                                      # inside a worktree of the PR head, so the verifier reads the REAL
                                      # code to confirm/refute a finding instead of guessing from a diff
                                      # snippet. Uses the `claude:` block below (point it at GLM via Z.ai
                                      # for a flat-subscription, $0 verifier). Lenses stay on DeepSeek.
                                      # Hot KILL-SWITCH (off stops using it); enabling from cold needs a
                                      # restart. Best-effort: no worktree / a failed run → prompt-only
                                      # scoring. With this on, scoring_votes: 1 is plenty (each vote is a
                                      # slow multi-turn CLI run).

# Used by review.advisor_provider: claude AND review.agentic_scoring (shared block). Auth is the
# Claude CLI's own login (a subscription) — run `claude` once interactively — UNLESS base_url is set,
# which points the CLI at an Anthropic-compatible endpoint (e.g. GLM via Z.ai) using api_key_env.
claude:
  claude_path: claude                 # path to the Claude Code CLI (on PATH by default)
  model: opus                         # model alias passed to `claude -p --model` (e.g. glm-4.7 for Z.ai)
  request_timeout_seconds: 600        # per call; agentic verify() runs are multi-turn — consider 900+
  # base_url: https://api.z.ai/api/anthropic   # Anthropic-compatible endpoint override. Omit → Claude
  #                                             # subscription auth. Sent via env, never argv.
  # api_key_env: ZAI_API_KEY          # NAME of the env var with the endpoint token (required iff base_url)
  prices:                             # USD per 1M tokens — subscription is flat, so 0/0
    input_per_1m: 0.0                 # → advisor/verifier passes are reported as $0 (budget never blocks)
    output_per_1m: 0.0

# Only used when review.advisor_provider: openai. A generic OpenAI-compatible advisor
# (a second client pointed at base_url). Example below = GLM-5.2 on a Z.ai Coding Plan.
advisor:
  base_url: https://api.z.ai/api/coding/paas/v4   # SUBSCRIPTION endpoint. NOT api/paas/v4 —
                                      # the pay-as-you-go path returns 429 "Insufficient balance"
                                      # even with a valid Coding-Plan key.
  model: glm-5.2
  api_key_env: ZAI_API_KEY            # NAME of the env var holding the key (never the key itself)
  send_thinking_extra_body: false     # DeepSeek-only `thinking` extra_body; GLM rejects it — keep false
  request_timeout_seconds: 600
  prices:                             # USD per 1M tokens — flat subscription → 0/0 reports $0
    input_per_1m: 0.0
    output_per_1m: 0.0

storage:
  db_path: ~/.local/state/ghcr/ghcr.db
  repos_dir: ~/.local/state/ghcr/repos   # bare-clone cache for review.local_checkout (restart-only).
                                          # Grows per reviewed head; safe to `rm -rf` to reclaim disk.

logging:
  level: INFO
