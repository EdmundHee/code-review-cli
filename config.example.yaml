# Copy to config.yaml and edit. config.yaml is gitignored.
# Secrets are NOT stored here — only the names of the env vars that hold them.

github:
  gh_path: /opt/homebrew/bin/gh      # ABSOLUTE path — bypasses shell shims/aliases
  token_env: GH_TOKEN                 # daemon reads the bot PAT from this env var
  bot_login: edmundhee-reviewbot      # the bot's REAL username (no [bot] suffix)
  request_timeout_seconds: 60

deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  thinking: enabled                   # enabled | disabled
  reasoning_effort: high              # high | max  (only used when thinking=enabled)
  request_timeout_seconds: 600
  prices:                             # USD per 1M tokens — for cost logging only
    input_per_1m: 0.28
    output_per_1m: 3.48               # post-promo rate (promo ended 2026-05-31)

repos:
   - owner/repo-two

poll:
  interval_seconds: 180

review_policy:
  skip_drafts: true
  review_backlog_on_start: false      # false = baseline existing open PRs as seen on first run
  ignore_authors:
    - dependabot[bot]
    - renovate[bot]
    - github-actions[bot]
  # bot_login is always added to this set automatically.

diff:
  max_diff_bytes: 400000              # raw-read + post-filter cap
  per_run_input_token_cap: 250000     # context-size gate (chars/4); in multi it caps the SUM over lenses
  oversized_behavior: notice          # notice | skip
  # test_globs: paths the test_coverage lens treats as tests (omit to use built-in defaults)
  skip_globs:
    - "**/*.lock"
    - "**/package-lock.json"
    - "**/pnpm-lock.yaml"
    - "**/yarn.lock"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/dist/**"
    - "**/build/**"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/__generated__/**"
    - "**/*.pb.go"
    - "**/*.snap"
    - "**/*.svg"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.pdf"

budgets:
  daily_usd_budget: 5.00              # rolling 24h ceiling across all reviews
  budget_exceeded_behavior: notice    # notice | skip

review:
  mode: multi                         # multi (default, accurate) | single (one call)
  # multi runs each lens as its own model call, then scores EVERY finding — so it
  # costs roughly (lenses + findings*scoring_votes)x a single review. That is the
  # intended trade: accuracy over cost.
  confidence_threshold: 80            # keep only findings scored >= this (0-100)
  scoring_votes: 1                    # score each finding N times; median is kept (odd N)
  lenses:                             # omit to use all; test_coverage drives the verdict
    - correctness
    - security
    - maintainability
    - test_coverage
  max_parallel: 0                     # cap concurrent model calls; 0 = unbounded
  read_prior_comments: true           # feed the PR's existing comments (bot + human,
                                      # timeline + inline) back as context, and let the
                                      # scorer suppress issues already raised. false to disable.
  prior_comment_max_chars: 6000       # budget for the rendered prior-discussion block
  rereview_on_mention: true           # a new comment that @mentions the bot triggers a fresh
                                      # full review (no new commit needed). false to disable.

storage:
  db_path: ~/.local/state/ghcr/ghcr.db

logging:
  level: INFO
