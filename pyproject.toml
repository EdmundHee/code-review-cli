[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghcr"
version = "0.1.0"
description = "Local daemon that reviews GitHub PRs with DeepSeek and comments as a bot account"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ghcr = "ghcr.cli:main"

[tool.setuptools.packages.find]
include = ["ghcr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
